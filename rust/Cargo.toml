[package]
name = "urna-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reescrita em Rust do backend da urna educacional. Não use em eleições reais."
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
tower = "0.5"
tower-http = { version = "0.7", features = ["timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "aes", "hkdfsha2"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
thiserror = "2"
base64 = "0.23"
hex = "0.4"
subtle = "2"
zeroize = "1"
getrandom = "0.3"
dotenvy = "0.15"
serde_path_to_error = "0.1"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
