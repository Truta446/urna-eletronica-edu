<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Arquitetura em contextos isolados">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="16" fill="#0f1b2d"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="22" font-weight="700" fill="#ffffff">Monólito modular com contextos isolados</text>
    <text x="40" y="74" font-size="14" fill="#9fb3c8">Fastify é só um adaptador HTTP. Regras vivem no domínio; invariantes críticas também vivem no PostgreSQL.</text>

    <!-- actors -->
    <g font-size="14" fill="#ffffff">
      <rect x="40" y="110" width="170" height="54" rx="27" fill="#334155"/>
      <text x="125" y="142" text-anchor="middle">Administrador</text>
      <rect x="40" y="250" width="170" height="54" rx="27" fill="#334155"/>
      <text x="125" y="282" text-anchor="middle">Mesário (operador)</text>
      <rect x="40" y="390" width="170" height="54" rx="27" fill="#334155"/>
      <text x="125" y="422" text-anchor="middle">Eleitor (com token)</text>
    </g>

    <!-- contexts -->
    <g>
      <rect x="270" y="96" width="250" height="82" rx="12" fill="#1e3a5f" stroke="#4f8fd6"/>
      <text x="290" y="126" font-size="16" font-weight="700" fill="#cfe3fa">Election Admin</text>
      <text x="290" y="150" font-size="12" fill="#9fb3c8">eleições · candidatos · eleitores</text>
      <text x="290" y="166" font-size="12" fill="#9fb3c8">DRAFT → OPEN → CLOSED</text>

      <rect x="270" y="236" width="250" height="82" rx="12" fill="#4a3412" stroke="#d69e2e"/>
      <text x="290" y="266" font-size="16" font-weight="700" fill="#fbe3b5">Authorization</text>
      <text x="290" y="290" font-size="12" fill="#e5cfa3">verifica eleitor · marca has_voted</text>
      <text x="290" y="306" font-size="12" fill="#e5cfa3">emite token 256 bits (hash no banco)</text>

      <rect x="270" y="376" width="250" height="82" rx="12" fill="#14432c" stroke="#38a169"/>
      <text x="290" y="406" font-size="16" font-weight="700" fill="#c6f0d6">Ballot Box</text>
      <text x="290" y="430" font-size="12" fill="#a6d8b9">consome token · grava voto</text>
      <text x="290" y="446" font-size="12" fill="#a6d8b9">idempotente · não conhece eleitores</text>

      <rect x="580" y="376" width="200" height="82" rx="12" fill="#3b1f4f" stroke="#9f7aea"/>
      <text x="600" y="406" font-size="16" font-weight="700" fill="#e4d4fb">Tally</text>
      <text x="600" y="430" font-size="12" fill="#c8b6e6">só após CLOSED</text>
      <text x="600" y="446" font-size="12" fill="#c8b6e6">determinístico e reproduzível</text>

      <rect x="580" y="96" width="200" height="222" rx="12" fill="#262a33" stroke="#a0aec0"/>
      <text x="600" y="126" font-size="16" font-weight="700" fill="#e2e8f0">Audit Log</text>
      <text x="600" y="150" font-size="12" fill="#cbd5e0">append-only</text>
      <text x="600" y="168" font-size="12" fill="#cbd5e0">hash chain SHA-256</text>
      <text x="600" y="186" font-size="12" fill="#cbd5e0">JSON canônico (RFC 8785)</text>
      <text x="600" y="204" font-size="12" fill="#cbd5e0">verifyAuditChain()</text>
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#7fd1a8">
        <rect x="600" y="222" width="160" height="22" rx="4" fill="#1a1d24"/><text x="610" y="237">#41 h=4a7b…</text>
        <rect x="600" y="250" width="160" height="22" rx="4" fill="#1a1d24"/><text x="610" y="265">#42 prev=4a7b…</text>
        <rect x="600" y="278" width="160" height="22" rx="4" fill="#1a1d24"/><text x="610" y="293">#43 prev=c03e…</text>
      </g>

      <!-- database -->
      <g transform="translate(850 150)">
        <ellipse cx="100" cy="20" rx="100" ry="20" fill="#2b4a6f"/>
        <rect x="0" y="20" width="200" height="240" fill="#2b4a6f"/>
        <ellipse cx="100" cy="260" rx="100" ry="20" fill="#24405f"/>
        <ellipse cx="100" cy="20" rx="100" ry="20" fill="none" stroke="#6ea8e0"/>
        <text x="100" y="62" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
        <g font-size="12" fill="#cfe3fa">
          <text x="18" y="96">• UNIQUE / FK / CHECK</text>
          <text x="18" y="120">• triggers append-only</text>
          <text x="18" y="144">• UPDATE condicional (lock)</text>
          <text x="18" y="168">• transações atômicas</text>
          <text x="18" y="192">• roles com menor privilégio</text>
          <text x="18" y="216">• migrations versionadas</text>
        </g>
      </g>
    </g>

    <!-- arrows -->
    <g stroke="#44546a" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="212" y1="137" x2="266" y2="137"/>
      <line x1="212" y1="277" x2="266" y2="277"/>
      <line x1="212" y1="417" x2="266" y2="417"/>
      <line x1="522" y1="137" x2="576" y2="137"/>
      <line x1="522" y1="277" x2="576" y2="277"/>
      <line x1="522" y1="417" x2="576" y2="417"/>
      <line x1="782" y1="207" x2="846" y2="230"/>
      <line x1="782" y1="417" x2="846" y2="370"/>
    </g>
    <g stroke="#44546a" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#a)">
      <path d="M680 374 L680 322"/>
    </g>

    <!-- the wall -->
    <g>
      <line x1="250" y1="340" x2="540" y2="340" stroke="#e53e3e" stroke-width="3" stroke-dasharray="10 6"/>
      <rect x="300" y="329" width="190" height="22" rx="11" fill="#e53e3e"/>
      <text x="395" y="345" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">sem vínculo eleitor ↔ voto</text>
    </g>

    <text x="40" y="520" font-size="13" fill="#9fb3c8">Cada contexto só depende do que precisa. O token é a única coisa que atravessa a fronteira — e ele morre ao ser usado.</text>
  </g>
</svg>
